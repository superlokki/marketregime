plugins { id 'java' }

group = 'com.marketregime'
version = '1.0.2'

def addonUser = findProperty('addonUser') ?: 'BrunoF'
def addonName = 'MarketRegime'

def bookmapLib = findProperty('bookmapLib') ?: 'C:/Program Files/Bookmap/lib'
def twsApiDir = findProperty('twsApiDir') ?: 'C:/Users/superpc/tws-api/source/javaclient'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}

dependencies {
    compileOnly files("$bookmapLib/bm-l1api.jar", "$bookmapLib/bm-simplified-api-wrapper.jar")
    implementation files("$twsApiDir/TwsApi.jar", "$twsApiDir/jars/protobuf-java-4.29.5.jar")
}

def classesDir = layout.buildDirectory.dir('classes')
sourceSets.main.java.destinationDirectory = classesDir
sourceSets.test.java.destinationDirectory = layout.buildDirectory.dir('test-classes')

def marker = 'bm-strategy-package-fs-root.jar'
def addonVersion = version.toString()
compileJava.inputs.property('addonVersion', addonVersion)
compileJava.doLast {
    // Décompresse TwsApi.jar et protobuf dans build/classes pour le rechargement rapide Bookmap
    copy {
        from zipTree("$twsApiDir/TwsApi.jar")
        from zipTree("$twsApiDir/jars/protobuf-java-4.29.5.jar")
        into classesDir
        include 'com/**'
    }
    classesDir.get().file(marker).asFile.createNewFile()
    classesDir.get().file('com/marketregime/version.txt').asFile.text = addonVersion
}

jar {
    archiveFileName = "${addonUser}_${addonName}_${version}.jar"
    destinationDirectory = projectDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(classesDir) {
        exclude marker
    }
}
